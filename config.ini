# Star Wars Unlimited Card Scraper Configuration

[database]
# SQLite database file path
db_path = data/db/swu_cards.db
# Schema file path
schema_path = data/schema.sql

[api]
# Base API URL
base_url = https://admin.starwarsunlimited.com/api/card-list
# Default locale
default_locale = en
# Page size for pagination
page_size = 40
# Rate limiting - requests per second
rate_limit = 2

[scraper]
# Maximum retries for failed requests
max_retries = 3
# Timeout for requests (seconds)
timeout = 30
# Delay between requests (seconds)
request_delay = 0.5

[images]
# Whether to download card images
download_images = true
# Image download directory
images_dir = images
# Image formats to download (card, small, medium, thumbnail)
image_formats = card,thumbnail

[logging]
# Log level (DEBUG, INFO, WARNING, ERROR)
log_level = INFO
# Log file path
log_file = logs/scraper.log
